<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réserver un Essai - e_ZAFA</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../deco.css">
    <link rel="icon" href="../img/logo.png">
    <style>
        .booking-container {
            max-width: 1000px;
            margin: 2rem auto 4rem auto;
            padding: 0 1rem;
        }

        .booking-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: var(--card-shadow);
        }

        .step-title {
            font-size: 1.3rem;
            color: var(--secondary-color);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .step-title span {
            background: var(--primary-color);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .grid-two-cols {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2.5rem;
        }

        @media (max-width: 768px) {
            .grid-two-cols {
                grid-template-columns: 1fr;
            }
        }

        /* --- CARTE SVG RÉGIONS FRANCE --- */
        .map-wrapper {
            position: relative;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
        }

        .france-map {
            width: 100%;
            height: 320px;
        }

        .region-path {
            fill: #cbd5e1;
            stroke: #ffffff;
            stroke-width: 1.5;
            cursor: pointer;
            transition: fill 0.3s, transform 0.2s;
        }

        .region-path:hover {
            fill: #94a3b8;
        }

        .region-path.selected {
            fill: var(--primary-color) !important;
        }

        .selected-region-text {
            margin-top: 10px;
            font-weight: 600;
            color: var(--secondary-color);
        }

        .map-tooltip {
            position: absolute;
            display: none;
            background-color: var(--secondary-color);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            z-index: 100;
            transform: translate(-50%, -120%);
            transition: opacity 0.15s ease-out;
        }

        /* --- CALENDRIER DYNAMIQUE --- */
        .calendar-wrapper {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 1.2rem;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .calendar-header button {
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            color: var(--secondary-color);
            padding: 5px 10px;
        }

        .calendar-days-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--gray-color);
            margin-bottom: 8px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .day-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
        }

        .day-cell:hover:not(.disabled) {
            background: #e2e8f0;
        }

        .day-cell.disabled {
            color: #cbd5e1;
            cursor: not-allowed;
            background: #f1f5f9;
        }

        .day-cell.selected {
            background: var(--secondary-color);
            color: white;
            font-weight: bold;
            border-color: var(--secondary-color);
        }

        /* --- FORMULAIRE --- */
        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary-color);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <main class="booking-container">
        <a href="../index.html#catalogue" style="display:inline-block; margin-bottom: 20px; color: var(--gray-color); text-decoration: none;">
            <i class="fa-solid fa-arrow-left"></i> Retour au catalogue
        </a>

        <div class="booking-card">
            <h1 style="text-align: center; color: var(--secondary-color); margin-bottom: 0.5rem;">Réservez votre essai privé</h1>
            <p style="text-align: center; color: var(--gray-color); margin-bottom: 2.5rem;">Choisissez le centre e_ZAFA le plus proche et sélectionnez la date de votre rendez-vous.</p>

            <form id="bookingForm" action="https://formspree.io/f/e.zafa.qse@gmail.com" method="POST">

                <!-- ÉTAPE 1 ET 2 : CARTE ET CALENDRIER -->
                <div class="grid-two-cols">

                    <!-- Sélection Région -->
                    <div>
                        <div class="step-title">
                            <span>1</span> Choisissez votre région
                        </div>
                        <div class="map-wrapper">
                            <div id="mapTooltip" class="map-tooltip"></div>
                            <svg class="france-map" viewBox="0 0 600 550" xmlns="http://www.w3.org/2000/svg">
                                <!-- Île-de-France -->
                                <path class="region-path" data-region="Île-de-France" d="M300,180 L330,170 L340,200 L310,210 Z" />
                                <!-- Hauts-de-France -->
                                <path class="region-path" data-region="Hauts-de-France" d="M280,70 L350,60 L360,150 L300,180 L270,120 Z" />
                                <!-- Grand Est -->
                                <path class="region-path" data-region="Grand Est" d="M350,60 L480,90 L490,210 L340,200 L360,150 Z" />
                                <!-- Normandie -->
                                <path class="region-path" data-region="Normandie" d="M180,110 L280,70 L300,180 L210,170 Z" />
                                <!-- Bretagne -->
                                <path class="region-path" data-region="Bretagne" d="M80,150 L180,110 L210,170 L110,200 Z" />
                                <!-- Pays de la Loire -->
                                <path class="region-path" data-region="Pays de la Loire" d="M110,200 L210,170 L230,260 L140,270 Z" />
                                <!-- Centre-Val de Loire -->
                                <path class="region-path" data-region="Centre-Val de Loire" d="M210,170 L340,200 L310,300 L230,260 Z" />
                                <!-- Bourgogne-Franche-Comté -->
                                <path class="region-path" data-region="Bourgogne-Franche-Comté" d="M340,200 L490,210 L450,330 L310,300 Z" />
                                <!-- Nouvelle-Aquitaine -->
                                <path class="region-path" data-region="Nouvelle-Aquitaine" d="M140,270 L310,300 L280,480 L160,450 Z" />
                                <!-- Auvergne-Rhône-Alpes -->
                                <path class="region-path" data-region="Auvergne-Rhône-Alpes" d="M310,300 L450,330 L430,440 L300,410 Z" />
                                <!-- Occitanie -->
                                <path class="region-path" data-region="Occitanie" d="M280,480 L300,410 L400,420 L350,510 Z" />
                                <!-- PACA -->
                                <path class="region-path" data-region="Provence-Alpes-Côte d'Azur" d="M400,420 L480,390 L490,480 L350,510 Z" />
                            </svg>
                            <div class="selected-region-text" id="regionOutput">Cliquez sur une région sur la carte</div>
                            <input type="hidden" name="Région" id="selectedRegionInput" required>
                        </div>
                    </div>

                    <!-- Sélection Date -->
                    <div>
                        <div class="step-title">
                            <span>2</span> Sélectionnez une date
                        </div>
                        <div class="calendar-wrapper">
                            <div class="calendar-header">
                                <button type="button" id="prevMonth"><i class="fa-solid fa-chevron-left"></i></button>
                                <span id="calendarMonthYear" style="font-weight: 600;"></span>
                                <button type="button" id="nextMonth"><i class="fa-solid fa-chevron-right"></i>
